name: ci

on:
  push:
    branches: [main, 'wp/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Detect registry credentials
        id: creds
        env:
          NPM_USERNAME: ${{ secrets.NPM_USERNAME }}
          NPM_PASSWORD: ${{ secrets.NPM_PASSWORD }}
        run: |
          if [ -n "${NPM_USERNAME}" ] && [ -n "${NPM_PASSWORD}" ]; then
            echo "has_npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_npm=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_USERNAME/NPM_PASSWORD absent — npm ci may fail on private @zeus/@alephscript"
          fi

      - name: Configure registry basic-auth (_password)
        if: steps.creds.outputs.has_npm == 'true'
        env:
          NPM_USERNAME: ${{ secrets.NPM_USERNAME }}
          NPM_PASSWORD: ${{ secrets.NPM_PASSWORD }}
        run: |
          # DV-09 / D-24 (a): username + _password base64 — no JWT.
          # Do not echo secret values.
          HOST='npm.scriptorium.escrivivir.co'
          {
            echo "//${HOST}/:username=${NPM_USERNAME}"
            echo "//${HOST}/:_password=${NPM_PASSWORD}"
            echo "//${HOST}/:email=ci@scriptorium.escrivivir.co"
            echo "//${HOST}/:always-auth=true"
          } >> .npmrc

      - name: Install
        run: npm ci

      # WP-V16 (c) · V-L1-03 — antes era `node -e "console.log(…)"`: salía 0
      # siempre, o sea un verde por construcción. Ahora corre eslint de verdad
      # sobre `src` y este paso PUEDE fallar. Las 8 reglas que el legado viola
      # están en `warn` con su recuento en .eslintrc.cjs; el resto son error.
      - name: Lint (eslint · src)
        run: npm run lint

      - name: Compile production
        run: npm run compile:production

      # WP-V16 (a) · V-L1-01 — el probe importa la pieza real compilada; si el
      # artefacto falta o está obsoleto, falla (ya no hay espejo de repuesto).
      - name: Probe V08 (parser real)
        run: npm run probe:v08

      # `continue-on-error`: el resultado de este paso NO condiciona el job.
      # Declarado también en README §Qué verifica el CI.
      - name: Test (legado — soft, no condiciona el resultado)
        continue-on-error: true
        run: npm test --if-present

      - name: Package v1 .vsix
        run: npm run package:v1

      # WP-V16 (b) · V-L1-02 — glob: el nombre lo deriva scripts/vsix.mjs de
      # package.json. Subir la versión ya no rompe este paso.
      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: zigurat-vsix
          path: dist/*.vsix
          if-no-files-found: error
